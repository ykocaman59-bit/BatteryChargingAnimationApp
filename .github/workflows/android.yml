name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Fix and Build APK
      run: |
        # Doğru alt klasöre in (İç içe klasör karmaşasını önler)
        cd $(find . -maxdepth 2 -name "app" -type d | head -n 1 | xargs dirname)
        
        # settings.gradle içerisindeki uyumsuz satırı tamamen sil
        sed -i '/FAIL_ON_PROJECT_SETTINGS/d' settings.gradle || true
        
        # Gradle sarmalayıcısını oluştur ve derle
        gradle wrapper --gradle-version 8.0
        chmod +x gradlew
        ./gradlew assembleDebug
      env:
        TERM: dumb

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
        
