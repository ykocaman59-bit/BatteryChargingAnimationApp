name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build APK Direct
      run: |
        # Doğru proje klasörünü bul
        TARGET_DIR=$(find . -name "build.gradle" -not -path "*/.*" -exec dirname {} \; | head -n 1)
        if [ -n "$TARGET_DIR" ]; then
          cd "$TARGET_DIR"
        fi
        
        # Uyumsuz ayar satırını temizle
        if [ -f "settings.gradle" ]; then
          sed -i '/FAIL_ON_PROJECT_SETTINGS/d' settings.gradle || true
        fi
        
        # Gradle ile doğrudan derle (gradlew kullanmadan)
        gradle assembleDebug
      env:
        TERM: dumb

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
        
