name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Direct APK Build Fix
      run: |
        # İç içe ne kadar klasör varsa atla, doğrudan app klasörünün bir üst dizinine geç
        APP_DIR=$(find . -name "AndroidManifest.xml" -not -path "*/.*" -exec dirname {} \; | xargs dirname)
        if [ -d "$APP_DIR" ]; then
          cd "$APP_DIR"
        fi

        # Eğer kökte build.gradle yoksa app klasörünün içindekini köke taşıyıp tek proje yapalım
        if [ ! -f "build.gradle" ] && [ -f "app/build.gradle" ]; then
          cp app/build.gradle .
        fi

        # Gradle wrapper scriptini sıfırdan ve hatasız üret
        gradle wrapper --gradle-version 8.0
        chmod +x gradlew
        
        # Derlemeyi başlat
        ./gradlew assembleDebug
      env:
        TERM: dumb

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
        
