name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build Android App inside correct directory
      run: |
        # İç içe klasör durumunu kontrol edip doğru dizine geçiş yapıyoruz
        cd $(find . -maxdepth 2 -name "app" -type d | head -n 1 | xargs dirname)
        
        # Gradle sarmalayıcısına izin ver ve derle
        chmod +x gradlew || true
        if [ -f "gradlew" ]; then
          ./gradlew assembleDebug
        else
          gradle wrapper
          ./gradlew assembleDebug
        fi
      env:
        TERM: dumb

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
        
