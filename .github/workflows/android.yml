name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Ultimate Fix and Build
      run: |
        # Hangi klasörde olursa olsun settings.gradle dosyasını bul ve içeriğini hatasız versiyonla değiştir
        find . -name "settings.gradle" -exec bash -c '
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > "$1"
          echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS); repositories { google(); mavenCentral() } }" >> "$1"
          echo "rootProject.name = \"ChargingShow\"" >> "$1"
          echo "include \":app\"" >> "$1"
        ' _ {} \;

        # Doğru klasöre gir ve gradle ile derle
        TARGET_DIR=$(find . -name "build.gradle" -not -path "*/.*" -exec dirname {} \; | head -n 1)
        if [ -n "$TARGET_DIR" ]; then
          cd "$TARGET_DIR"
        fi

        gradle assembleDebug
      env:
        TERM: dumb

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
        
