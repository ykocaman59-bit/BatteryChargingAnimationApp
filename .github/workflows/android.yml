name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Fix Settings and Build APK
      run: |
        # settings.gradle içerisindeki uyumsuz satırı temizle
        sed -i '/FAIL_ON_PROJECT_SETTINGS/d' settings.gradle || true
        
        # Gradle derlemesini başlat
        gradle init --type basic --automation-language groovy --no-search-upward || true
        ./gradlew assembleDebug || gradle assembleDebug
      env:
        TERM: dumb

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        
