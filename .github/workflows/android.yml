name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Fix and Build APK
      run: |
        # İç içe klasör karmaşasını ortadan kaldırmak için gradle dosyalarının olduğu dizini bul ve oraya git
        PROJECT_DIR=$(find . -name "build.gradle" -not -path "*/app/*" -exec dirname {} \; | head -n 1)
        if [ -n "$PROJECT_DIR" ]; then
          cd "$PROJECT_DIR"
        fi
        
        # settings.gradle içerisindeki uyumsuz satırı temizle
        if [ -f "settings.gradle" ]; then
          sed -i '/FAIL_ON_PROJECT_SETTINGS/d' settings.gradle || true
        fi
        
        # Eğer gradlew yoksa oluştur ve derle
        if [ ! -f "gradlew" ]; then
          gradle wrapper --gradle-version 8.0
        fi
        
        chmod +x gradlew
        ./gradlew assembleDebug
      env:
        TERM: dumb

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
        
