name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Direct without Wrapper
      run: |
        # Gradle wrapper dosyalarına bakmadan doğrudan sistemi derlemeye zorluyoruz
        export GRADLE_USER_HOME=$HOME/.gradle
        mvn --version || true
        
        # Doğrudan sistem gradle komutu ile build alıyoruz
        gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        
