name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Bulletproof Build Fix
      run: |
        # Hangi klasörde olursa olsun eski ve bozuk settings.gradle dosyasını bul ve çöpe at
        find . -name "settings.gradle" -delete

        # Doğru yere tertemiz ve hatasız yeni settings.gradle oluştur
        TARGET_DIR=$(find . -name "build.gradle" -not -path "*/.*" -exec dirname {} \; | head -n 1)
        if [ -n "$TARGET_DIR" ]; then
          cd "$TARGET_DIR"
        fi

        echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
        echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS); repositories { google(); mavenCentral() } }" >> settings.gradle
        echo "rootProject.name = \"ChargingShow\"" >> settings.gradle
        echo "include \":app\"" >> settings.gradle

        # Wrapper kur ve derle
        gradle wrapper --gradle-version 8.0
        chmod +x gradlew
        ./gradlew assembleDebug
      env:
        TERM: dumb

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
        
