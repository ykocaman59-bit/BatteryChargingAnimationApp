name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Final Direct Build
      run: |
        # settings.gradle dosyasını kök dizinde düzelt
        find . -maxdepth 3 -name "settings.gradle" -exec bash -c '
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > "$1"
          echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS); repositories { google(); mavenCentral() } }" >> "$1"
          echo "rootProject.name = \"ChargingShow\"" >> "$1"
          echo "include \":app\"" >> "$1"
        ' _ {} \;

        # Kök dizinden çıkmadan doğrudan derle
        BUILD_FILE=$(find . -name "build.gradle" -not -path "*/app/*" | head -n 1)
        if [ -n "$BUILD_FILE" ]; then
          DIR=$(dirname "$BUILD_FILE")
          cd "$DIR"
        fi

        gradle assembleDebug
      env:
        TERM: dumb

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
        
