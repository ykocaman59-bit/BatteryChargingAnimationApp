name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: ./BatteryChargingAnimationApp-main # Dosyalarının olduğu alt klasör adı

    - name: Build with Gradle (Debug APK)
      run: ./gradlew assembleDebug
      working-directory: ./BatteryChargingAnimationApp-main

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: BatteryChargingAnimationApp-main/app/build/outputs/apk/debug/app-debug.apk
        
