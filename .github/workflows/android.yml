name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Debug APK derle
        shell: bash
        run: gradle assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      # Derleme patlarsa her hatayı KISA tek satır olarak "Annotations" kısmında göster
      - name: Hata özeti
        if: failure()
        shell: bash
        run: |
          grep -E "^e: " build.log | sed -E 's#^e: file://.*/([^/]+\.kt):#\1:#' | sort -u | head -15 > kt.txt || true
          while IFS= read -r line; do echo "::error::${line}"; done < kt.txt
          grep -E "What went wrong|Execution failed|AAPT|Manifest merger|Could not resolve" -A2 build.log | head -12 | while IFS= read -r l; do echo "::error::${l}"; done || true

      - name: Log dosyasını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: sarj-show-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
