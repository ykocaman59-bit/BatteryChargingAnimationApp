name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Ultimate Fix and Build
      run: |
        # Gerçek app klasörünün olduğu konumu tespit et ve kök dizini oraya sabitle
        APP_PATH=$(find . -name "AndroidManifest.xml" -not -path "*/.*" -exec dirname {} \;)
        if [ -n "$APP_PATH" ]; then
          ROOT_LEV=$(dirname "$APP_PATH")
          cd "$ROOT_LEV"
        fi

        # Eski ve bozuk gradle yapılandırma dosyalarını temizle
        rm -f settings.gradle build.gradle

        # app klasörünün bir üst dizininde eksiksiz ve hatasız kök build.gradle oluştur
        echo "plugins { id 'com.android.application' version '8.1.1' apply false; id 'org.jetbrains.kotlin.android' version '1.9.0' apply false }" > build.gradle

        # Eksiksiz ve hatasız settings.gradle oluştur
        echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
        echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS); repositories { google(); mavenCentral() } }" >> settings.gradle
        echo "rootProject.name = \"ChargingShow\"" >> settings.gradle
        echo "include \":app\"" >> settings.gradle

        # Wrapper kur ve derlemeyi başlat
        gradle wrapper --gradle-version 8.0
        chmod +x gradlew
        ./gradlew assembleDebug
      env:
        TERM: dumb

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
        
